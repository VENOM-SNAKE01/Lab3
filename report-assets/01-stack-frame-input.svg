<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="790" viewBox="0 0 1020 790">
<title>input 栈帧</title>
<rect width="1020" height="790" fill="#FFFFFF"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<text x="40.0" y="42.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#0F172A" text-anchor="start" font-weight="700">图 1  input 函数运行时的调用栈（dark-calc，固定栈基址）</text><text x="40.0" y="70.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#64748B" text-anchor="start" font-weight="normal">GDB: b input; r —— 高地址在上、低地址在下；调用栈向低地址方向生长</text><text x="176.0" y="165.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#475569" text-anchor="end" font-weight="normal">0x721000800ff8</text><rect x="190.0" y="132.0" width="520.0" height="56.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><text x="202.0" y="165.1" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="15" fill="#64748B" text-anchor="start" font-weight="normal">main 的返回地址  →  __libc_start_main</text><text x="202.0" y="127.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#DC2626" text-anchor="start" font-weight="normal">…</text><text x="176.0" y="229.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#475569" text-anchor="end" font-weight="normal">0x721000800ff0</text><rect x="190.0" y="196.0" width="520.0" height="56.0" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/><text x="202.0" y="229.1" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="15" fill="#0F172A" text-anchor="start" font-weight="normal">main 的 saved rbp</text><text x="698.0" y="229.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#334155" text-anchor="end" font-weight="normal">rbp (main)</text><text x="176.0" y="293.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#475569" text-anchor="end" font-weight="normal">0x721000800fe8</text><rect x="190.0" y="260.0" width="520.0" height="56.0" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/><text x="202.0" y="293.1" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="15" fill="#0F172A" text-anchor="start" font-weight="normal">0x0000000000401ad1</text><text x="698.0" y="293.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#334155" text-anchor="end" font-weight="normal">rbp+8</text><text x="202.0" y="255.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#DC2626" text-anchor="start" font-weight="normal">input 的返回地址</text><text x="176.0" y="357.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#475569" text-anchor="end" font-weight="normal">0x721000800fe0</text><rect x="190.0" y="324.0" width="520.0" height="56.0" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/><text x="202.0" y="357.1" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="15" fill="#0F172A" text-anchor="start" font-weight="normal">0x721000800ff0  (main 的 rbp)</text><text x="698.0" y="357.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#334155" text-anchor="end" font-weight="normal">rbp (input)</text><text x="176.0" y="421.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#475569" text-anchor="end" font-weight="normal">0x721000800fd8</text><rect x="190.0" y="388.0" width="520.0" height="56.0" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="202.0" y="421.1" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="15" fill="#0F172A" text-anchor="start" font-weight="normal">expression[8..15]</text><text x="698.0" y="421.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#334155" text-anchor="end" font-weight="normal">rbp-0x8</text><text x="176.0" y="485.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#475569" text-anchor="end" font-weight="normal">0x721000800fd0</text><rect x="190.0" y="452.0" width="520.0" height="56.0" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="202.0" y="485.1" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="15" fill="#0F172A" text-anchor="start" font-weight="normal">expression[0..7]</text><text x="698.0" y="485.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#334155" text-anchor="end" font-weight="normal">rsp = rbp-0x10</text><path d="M760 132 h9" stroke="#64748B" stroke-width="1.6" fill="none"/><line x1="760" y1="132" x2="760" y2="252" stroke="#64748B" stroke-width="1.6"/><path d="M760 252 h9" stroke="#64748B" stroke-width="1.6" fill="none"/><text x="778" y="192.0" transform="rotate(-90 778 192.0)" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#64748B" text-anchor="middle">main 的栈帧</text><path d="M760 260 h9" stroke="#059669" stroke-width="1.6" fill="none"/><line x1="760" y1="260" x2="760" y2="508" stroke="#059669" stroke-width="1.6"/><path d="M760 508 h9" stroke="#059669" stroke-width="1.6" fill="none"/><text x="778" y="384.0" transform="rotate(-90 778 384.0)" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#059669" text-anchor="middle">input 的栈帧</text><text x="920.0" y="142.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="normal">高地址</text><line x1="926" y1="154" x2="926" y2="494" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ar)"/><text x="920.0" y="518.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="normal">低地址</text><text x="40.0" y="552.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="start" font-weight="normal">① 与栈相关的两个寄存器：rbp（基址指针，指向当前栈帧底部）与 rsp（栈指针，指向当前栈顶）。</text><text x="40.0" y="579.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="start" font-weight="normal">② $rbp+8 = 0x721000800fe8，其中存放 0x401ad1 —— 这是 input 的返回地址，即 main 中「call input 的下一条指令」。</text><text x="40.0" y="606.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">③ input 自己的三条指令（push rbp / mov rbp,rsp / sub rsp,0x10）不会写 rbp+8；它来自 main 的 `call 401977 &lt;input&gt;`：</text><text x="40.0" y="633.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">     call 会把下一条指令地址（0x401ad1）压栈，所以 rbp+8 的值「凭空出现」在 input 的栈帧上方。</text><text x="40.0" y="660.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">④ $rbp 指向的 0x721000800fe0 存的是 0x721000800ff0，来自 prologue 的 push rbp —— 即调用者 main 的 rbp。</text><text x="40.0" y="687.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">⑤ leave = mov rsp,rbp; pop rbp（恢复 caller 的 rbp）；ret = pop rip（弹出 0x401ad1，控制流回到 main）。</text>
</svg>
