<text x="40.0" y="42.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" fill="#0F172A" text-anchor="start" font-weight="700">图 3  Task 1 payload 布局：劫持返回地址 + 命令注入执行 ./malware</text><text x="40.0" y="70.0" font-family="'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#64748B" text-anchor="start" font-weight="normal">payload.py —— gets 共写入 33 字节（32 字节数据 + 结尾 '\0'），未超过 47 字节的安全上限</text><text x="136.0" y="163.0" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#64748B" text-anchor="end" font-weight="normal">0x00</text><rect x="150.0" y="140.0" width="60.0" height="36.0" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="180.0" y="162.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">1</text><rect x="214.0" y="140.0" width="60.0" height="36.0" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="244.0" y="162.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">)</text><rect x="278.0" y="140.0" width="60.0" height="36.0" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="308.0" y="162.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">)</text><rect x="342.0" y="140.0" width="60.0" height="36.0" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="372.0" y="162.6" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="normal">;</text><rect x="406.0" y="140.0" width="60.0" height="36.0" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="436.0" y="162.6" font-family="'DejaVu Sans Mono','Consolas','Courier